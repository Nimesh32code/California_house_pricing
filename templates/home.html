<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA House Price Prediction</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --text: #f0ece4;
    --muted: #5a5550;
    --accent: #c9a84c;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow-x: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 50%, rgba(201,168,76,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 30%, rgba(201,168,76,0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle grid texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .header {
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 80px;
    height: 1px;
    background: var(--gold);
  }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .eyebrow::before {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--gold);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .subtitle {
    margin-top: 0.75rem;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    line-height: 1.6;
  }

  /* Form card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 2rem 2rem 2.5rem;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: 'CALIFORNIA';
    position: absolute;
    top: 1.25rem;
    right: 1.5rem;
    font-size: 0.5rem;
    letter-spacing: 0.3em;
    color: rgba(201,168,76,0.15);
    font-weight: 500;
  }

  /* Field grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }

  .field {
    position: relative;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 1.1rem 1.25rem 0.85rem;
    transition: background 0.2s ease;
  }

  .field:nth-child(even) { border-right: none; }
  .field:nth-last-child(1),
  .field:nth-last-child(2) { border-bottom: none; }

  .field:focus-within {
    background: rgba(201,168,76,0.04);
  }

  .field label {
    display: block;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
    transition: color 0.2s;
  }

  .field:focus-within label {
    color: var(--gold);
  }

  .field input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    font-weight: 400;
    color: var(--text);
    padding: 0;
    line-height: 1;
  }

  .field input::placeholder {
    color: #2e2e2e;
    font-size: 0.85rem;
  }

  /* Coordinates row – spans both columns */
  .coord-row {
    grid-column: span 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: none;
    padding: 0;
    border-right: none;
  }

  /* Wait – let's just keep them as regular fields */

  /* Submit */
  .submit-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  button[type="submit"] {
    background: var(--gold);
    color: #0a0a0a;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.9rem 2.5rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
    position: relative;
    overflow: hidden;
  }

  button[type="submit"]::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.12);
    opacity: 0;
    transition: opacity 0.2s;
  }

  button[type="submit"]:hover { background: var(--gold-light); }
  button[type="submit"]:hover::after { opacity: 1; }
  button[type="submit"]:active { transform: scale(0.98); }

  .disclaimer {
    font-size: 0.58rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    line-height: 1.7;
  }

  /* Result */
  .result {
    margin-top: 1.5rem;
    padding: 1.25rem 1.5rem;
    border: 1px solid rgba(201,168,76,0.3);
    background: rgba(201,168,76,0.05);
    display: none;
  }

  .result.visible { display: block; }

  .result-label {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .result-value {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
  }

  /* prediction from Flask */
  .prediction-text {
    margin-top: 1.5rem;
    padding: 1.25rem 1.5rem;
    border: 1px solid rgba(201,168,76,0.3);
    background: rgba(201,168,76,0.05);
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold);
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="eyebrow">ML Valuation Engine</div>
    <h1>California<br><em>House Price</em><br>Prediction</h1>
    <p class="subtitle">Enter property metrics below to generate<br>a machine-learning price estimate.</p>
  </div>

  <div class="card">
    <form action="/predict" method="post">
      <div class="grid">
        <div class="field">
          <label>Median Income</label>
          <input type="text" name="MedInc" placeholder="e.g. 3.87" required>
        </div>
        <div class="field">
          <label>House Age</label>
          <input type="text" name="HouseAge" placeholder="e.g. 28" required>
        </div>
        <div class="field">
          <label>Avg. Rooms</label>
          <input type="text" name="AveRooms" placeholder="e.g. 5.2" required>
        </div>
        <div class="field">
          <label>Avg. Bedrooms</label>
          <input type="text" name="AveBedrms" placeholder="e.g. 1.1" required>
        </div>
        <div class="field">
          <label>Population</label>
          <input type="text" name="Population" placeholder="e.g. 1200" required>
        </div>
        <div class="field">
          <label>Avg. Occupancy</label>
          <input type="text" name="AveOccup" placeholder="e.g. 3.0" required>
        </div>
        <div class="field">
          <label>Latitude</label>
          <input type="text" name="Latitude" placeholder="e.g. 34.05" required>
        </div>
        <div class="field">
          <label>Longitude</label>
          <input type="text" name="Longitude" placeholder="e.g. -118.24" required>
        </div>
      </div>

      <div class="submit-row">
        <button type="submit">Run Prediction →</button>
        <p class="disclaimer">Model trained on 1990 CA Census data.<br>Values are estimates only.</p>
      </div>
    </form>

    {% if prediction_text %}
    <div class="prediction-text">{{ prediction_text }}</div>
    {% endif %}
  </div>
</div>

</body>
</html>
